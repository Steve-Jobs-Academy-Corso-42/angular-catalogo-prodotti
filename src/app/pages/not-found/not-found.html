<!-- La pagina comunica l'errore e offre una navigazione diretta verso il catalogo. -->
<main class="grid min-h-[60vh] place-items-center px-4 py-12 sm:px-6">
  <section
    class="w-full max-w-xl rounded-3xl border border-line bg-white px-6 py-12 text-center shadow-sm sm:px-10"
    aria-labelledby="not-found-title"
  >
    <p class="font-display text-7xl font-bold tracking-tight text-brand sm:text-8xl">404</p>
    <h1 id="not-found-title" class="mt-4 text-2xl font-bold text-ink sm:text-3xl">
      Pagina non trovata
    </h1>
    <p class="mt-3 leading-7 text-muted">
      L'indirizzo potrebbe essere errato oppure la pagina potrebbe non essere più disponibile.
    </p>

    <!-- RouterLink evita il ricaricamento completo quando si torna alla pagina iniziale. -->
    <a
      routerLink="/"
      class="mt-8 inline-flex items-center justify-center rounded-lg bg-brand px-5 py-3 text-sm font-semibold text-white transition-colors hover:bg-brand/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
    >
      Torna al catalogo
    </a>
  </section>
</main>
